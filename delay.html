<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mau ngapain?</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 300;
      max-width: 520px;
      margin: 0 auto;
      padding: 80px 40px;
      line-height: 1.7;
      color: #1a1a1a;
      background: #fff;
    }
    h1 {
      font-weight: 400;
      font-size: 1.8rem;
      margin-bottom: 25px;
      letter-spacing: -0.02em;
    }
    .countdown {
      font-weight: 300;
      font-size: 4.5rem;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 8px;
      font-variant-numeric: tabular-nums;
      color: #1a1a1a;
    }
    .label {
      font-size: 0.85rem;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>mau ngapain?</h1>

  <div class="countdown" id="countdown">20</div>
  <div class="label">seconds</div>

<script>
  const raw = window.location.search.substring(1);
  const parts = raw.split('&');
  const blockedUrl = parts[1] ? decodeURIComponent(parts[1]) : '';
  const delaySecs = parts[2] ? parseInt(parts[2], 10) : 20;
  const fullDelay = isNaN(delaySecs) ? 20 : delaySecs;

  let remaining = fullDelay;
  const countdownEl = document.getElementById('countdown');
  countdownEl.textContent = remaining;

  let timer = null;
  let paused = false;

  function tick() {
    if (paused) return;
    remaining -= 1;
    if (remaining <= 0) {
      countdownEl.textContent = 0;
      clearInterval(timer);
      if (blockedUrl) window.location.href = blockedUrl;
      return;
    }
    countdownEl.textContent = remaining;
  }

  function start() {
    if (timer) return;
    timer = setInterval(tick, 1000);
  }

  start();

  window.addEventListener('blur', () => {
    paused = true;
    remaining = fullDelay;
    countdownEl.textContent = remaining;
    if (timer) { clearInterval(timer); timer = null; }
  });

  window.addEventListener('focus', () => {
    paused = false;
    start();
  });
</script>
</body>
</html>
