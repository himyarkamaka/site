<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>himyar kamaka</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 300;
      max-width: 520px;
      margin: 0;
      padding: 80px 40px;
      line-height: 1.7;
      color: #1a1a1a;
      background: #fff;
    }
    h1 {
      font-weight: 400;
      font-size: 1.8rem;
      margin-bottom: 25px;
      letter-spacing: -0.02em;
    }
    img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      margin-bottom: 15px;
    }
    p {
      font-size: 0.95rem;
      color: #444;
      margin-bottom: 12px;
    }
    a {
      color: #1a1a1a;
      text-decoration: none;
      border-bottom: 1px solid #ccc;
    }
    a:hover {
      border-bottom-color: #1a1a1a;
    }
    .lang {
      font-size: 0.95rem;
      color: #bbb;
    }
    .lang button {
      font: inherit;
      color: #bbb;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }
    .lang button:hover,
    .lang button[aria-pressed="true"] {
      color: #1a1a1a;
    }
  </style>
</head>
<body>
  <div class="lang">
    <button type="button" data-set="en" aria-pressed="true">en</button> /
    <button type="button" data-set="id" aria-pressed="false">id</button>
  </div>

  <h1>himyar kamaka</h1>

  <img src="headshot.jpg" alt="Himyar Kamaka Portrait">

  <p data-en="economics + mathematics undergraduate at uchicago with interests in development economics."
     data-id="mahasiswa double major ekonomi + matematika di uchicago dengan minat pada ekonomi pembangunan.">economics + mathematics undergraduate at uchicago with interests in development economics.</p>

  <p><a href="https://www.linkedin.com/in/himyarkamaka" target="_blank" rel="noopener"
     data-en="more on linkedin"
     data-id="selengkapnya di linkedin">more on linkedin</a></p>

  <script>
    function setLang(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-' + lang + ']').forEach(function (el) {
        el.textContent = el.getAttribute('data-' + lang);
      });
      document.querySelectorAll('.lang button').forEach(function (b) {
        b.setAttribute('aria-pressed', b.dataset.set === lang);
      });
      try { localStorage.setItem('lang', lang); } catch (e) {}
    }
    document.querySelectorAll('.lang button').forEach(function (b) {
      b.addEventListener('click', function () { setLang(b.dataset.set); });
    });
    try { if (localStorage.getItem('lang') === 'id') setLang('id'); } catch (e) {}
  </script>
</body>
</html>
